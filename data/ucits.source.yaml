twins:
  VOO:
    match: exact
    funds:
    - CSPX
    - VUAA
    - SPYL
    note: Stejný index S&P 500.
  SPY:
    match: exact
    funds:
    - CSPX
    - VUAA
    - SPYL
    note: Stejný index S&P 500.
  IVV:
    match: exact
    funds:
    - CSPX
    - VUAA
    - SPYL
    note: Stejný index S&P 500.
  VTI:
    match: similar
    funds:
    - XD9U
    note: Celý trh USA (CRSP/Morningstar) v UCITS neexistuje. MSCI USA pokrývá cca 85 % tržní kapitalizace a neobsahuje malé firmy. Nejde o dvojče.
  VT:
    match: similar
    funds:
    - VWCE
    note: Vanguard VT sleduje FTSE Global All Cap (obsahuje malé firmy), UCITS FTSE All-World je bez malých firem. Stejný emitent a podobné pokrytí.
  VEA:
    match: similar
    funds:
    - EXUS
    note: Index FTSE Developed ex US v UCITS nenalezen. MSCI World ex USA je nejbližší ověřená alternativa.
  VWO:
    match: similar
    funds:
    - VFEA
    note: Vanguard UCITS sleduje FTSE Emerging Index. Složení se může od VWO mírně lišit.
  VYM:
    match: similar
    funds:
    - VHYA
    note: VYM drží jen USA, UCITS verze je globální (FTSE All-World High Dividend Yield). Nejde o dvojče.
  VUG:
    match: none
    funds: []
    note: UCITS dvojče ani blízká alternativa nebyla ověřena.
  SCHD:
    match: none
    funds: []
    note: UCITS dvojče sledující Dow Jones U.S. Dividend 100 nebylo nalezeno. Nalezený iShares Dow Jones U.S. Select Dividend (DE000A0D8Q49) sleduje jiný index a je domicilovaný v Německu, proto ho neuvádíme
      jako dvojče.
  AGG:
    match: exact
    funds:
    - IUAA
    note: Stejný index Bloomberg U.S. Aggregate. Třída v USD, akumulační.
  GLD:
    match: similar
    funds:
    - SGLN
    note: Stejné podkladové aktivum (zlato, LBMA Gold Price). Jde o ETC, ne o UCITS ETF.
