<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>B – VOO</title>
<link rel="stylesheet" href="ad.css">
</head>
<body class="{{format}}"><main class="ad">
  <header class="masthead"><p class="brand"><span>ETF</span> tahák</p><p class="edition">PRO ČESKÉ INVESTORY</p></header>
  <section class="concept">
    <h1 class="headline">{{headline}}<sup>*</sup></h1>
    <p class="subhead">{{subhead}}</p>
    <div class="comparison">
      <div class="comparison-head"><span>{{usLabel}}</span><span>{{euLabel}}</span></div>
      {{rows}}
      <p class="comparison-note">{{comparisonNote}}</p>
    </div>
  </section>
  <section class="delivery">
    <div class="product">
      <img src="../../public/tahak/preview-twins.png" alt="Skutečná strana taháku s evropskými alternativami">
      <div><p class="product-label">PDF ZDARMA · {{pages}} STRAN</p><p class="product-title">{{offer}}</p><p class="product-detail">{{offerDetail}}</p></div>
    </div>
    <p class="cta"><span>{{cta}}</span><span class="arrow">↗</span></p>
  </section>
  <footer><p class="fine">{{fine}}</p><p class="domain">etf-tahak.vercel.app</p></footer>
</main></body></html>
