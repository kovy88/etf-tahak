<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>A – Poplatky</title>
<link rel="stylesheet" href="ad.css">
 </head>
<body class="{{format}}"><main class="ad">
  <header class="masthead"><p class="brand"><span>ETF</span> tahák</p><p class="edition">PRO ČESKÉ INVESTORY</p></header>
  <section class="concept">
    <h1 class="headline">{{headline}}</h1>
    <div>
      <p class="result-label">{{resultLabel}}</p>
      <p class="result-number"><span class="amount">{{amount}}</span><span class="currency">Kč</span></p>
    </div>
    <div class="costs">
      <div><p class="cost-label">{{fundLabel}}</p><p class="cost-value">{{fundTer}}</p></div>
      <div><p class="cost-label">{{etfLabel}}</p><p class="cost-value etf">{{etfTer}}</p></div>
    </div>
  </section>
  <section class="delivery">
    <div class="product">
      <img src="../../public/tahak/preview-compare.png" alt="Skutečná strana ETF taháku">
      <div><p class="product-label">PDF ZDARMA · {{pages}} STRAN</p><p class="product-title">{{offer}}</p><p class="product-detail">{{offerDetail}}</p></div>
    </div>
    <p class="cta"><span>{{cta}}</span><span class="arrow">↗</span></p>
  </section>
  <footer><p class="fine">{{fine}}</p><p class="domain">etf-tahak.vercel.app</p></footer>
</main></body></html>
